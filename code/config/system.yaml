# System configuration. All values marked "tbd" must be measured / taught on the real setup.
# Units: mm and degrees everywhere in this file (M2 converts to m / rad for the Neura API).

# Default for `python -m orchestrator` (GUI: selectable). detector: mock|replay|camera|ai, robot: mock|sim|vm|real, inspector: mock|replay|camera
implementations:
  detector: mock
  robot: mock
  inspector: mock

logging:
  level: INFO
  cycle_dir: logs

# --- M1: top-down camera ----------------------------------------------------
topdown_camera:
  # int = OpenCV device index, string = image file / glob (replay, relative to code/).
  # Three cameras: topdown_camera (M1), inspection_camera (M3), wrist_camera (M4) - each needs its own index.
  source: 0
  width: 1920
  height: 1080
  calibration_file: null        # tbd, e.g. config/topdown_intrinsics.yaml

workspace:
  # aruco: 4 markers | white_frame: inner edge of the white frame | auto: aruco, fallback white_frame
  # (no white frame on the board any more -> aruco only)
  method: aruco
  # Extent of the workspace frame [mm]. Marker centres are 400 mm apart; the workspace is the
  # square between them, inset by 35 mm so the white marker paper (50 mm marker + quiet zone,
  # ~67 mm) stays outside and is not detected as a part.
  size_mm: [330.0, 330.0]
  px_per_mm: 2.0                # resolution of the rectified workspace image
  border_mm: 5.0                # ignored margin along the workspace edge
  aruco_dictionary: DICT_4X4_50
  # Marker centre positions in the workspace frame [mm]. Origin = bottom-left corner of the
  # workspace (35 mm inside marker 0), x to the right, y up (as seen by the camera).
  markers_mm:
    0: [-35.0, -35.0]
    1: [365.0, -35.0]
    2: [365.0, 365.0]
    3: [-35.0, 365.0]

part_topdown:
  # Part = pixels clearly brighter OR more colourful (Lab chroma) than the (dark grey) board median.
  # Photos 2026-10-05: board chroma ~2, bluish reflection ~10, purple part 40-50.
  brightness_delta: 50
  chroma_delta: 20
  min_area_mm2: 300
  max_area_mm2: 20000
  chamfer_min_frac: 0.08        # chamfer depth relative to short side to count as found

# 2D rigid transform workspace frame -> robot base frame (tbd, from teach-in of frame corners)
workspace_to_robot:
  rotation_deg: 0.35
  translation_mm: [205.1, -319.7]
  table_z_mm: 2.1

# --- M2: robot (Neura LARA, neurapy v5.0.8) ------------------------------------
robot:
  host: 192.168.2.13            # IP printed on the robot base (tbd: verify, Neura default is 192.168.2.13)
  vm_host: 192.168.2.13         # official Neura simulation (VirtualBox VM, host-only network), robot kind "vm"
  # ALL poses and limits below are TCP poses of this tool in the robot BASE frame (not the flange).
  tool_name: ZimmerLWR50            # tool as created in the Neura GUI (found in robot backup)
  # Expected TCP offset of tool_name from the flange [mm]. connect() refuses to move if the controller
  # tool differs by more than 1 mm. 197.5 = LWR50L with jaws 169.5 + LWR50F 28 (data sheets, tbd: measure
  # in the lab). The robot backup still has 210 mm -> set offsetZ of the tool on the pendant to this value.
  tool_tcp_mm: [0.0, 0.0, 197.5]
  home_point: Home              # named point stored on the robot
  override: 0.2                 # global speed override 0..1 (keep low while testing)
  joint_speed_percent: 20
  linear_speed_mps: 0.10
  approach_speed_mps: 0.03      # final linear approach / retreat
  approach_height_mm: 80
  # pick/place: down with linear_speed_mps to this height above the target, the rest with
  # approach_speed_mps (same way back up). >= approach_height_mm: whole way slow
  approach_slow_mm: 20
  grasp_height_mm: 5           # TCP height above table when grasping (depends on part / gripper)
  # rz relative to home so that the jaws close across the short side of a part with theta = 0 (long
  # axis along base x): 90 deg + 23 deg gripper mounting angle (lab 2026-10-06: home +23 deg -> jaws close
  # along base x, i.e. grip a part lying along base y / marker edge 0-3 as at the stations)
  gripper_angle_offset_deg: 113.0
  grip_wait_s: 1.0
  gripper_enabled: false         # false = move only, skip grasp/release (first tests); always off for the Neura VM
  # Software workspace limits in robot base frame [mm]
  limits_mm:
    x: [100.0, 900.0]
    y: [-500.0, 500.0]
    z: [-10.0, 600.0]
  # Named poses: TCP of tool_name, [x, y, z, rx, ry, rz] in mm / deg (tbd, teach on real robot)
  # "home" = Home point: flange at z 434.5 mm (robot backup) -> TCP at 434.5 - 197.5 = 237.0 mm.
  # Home is driven as joint point; this entry gives orientation and map position.
  # Reach (Neura VM, tool pointing down): radius ~740 mm at z 130, ~700 mm at z 180 -> keep the
  # approach points (pose z + approach_height_mm) inside.
  # Stations = centre points of the zones beyond the far marker edge (camera view, workspace frame
  # approx.: bin_bad (50, 580), bin_good (50, 480), inspection (255, 455) mm). Each pose is the
  # exact place pose incl. its own z (inspection: printed fixture, surface 38 mm above the board).
  # Values below: estimate from a sketch via the placeholder workspace_to_robot -> teach with
  # 'robot_check teach' (place() opens the gripper exactly at the pose).
  poses:
    home: [420.0, 0.0, 237.0, 180.0, 0.0, 180.0]
    inspection: [520.8, 199.6, 42.0, -180.0, -0.0, -157.0]
    bin_good: [299.7, 185.4, 4.0, -180.0, -0.0, -157.0]
    bin_bad: [297.7, 319.4, 3.0, -180.0, -0.0, -157.0]

# --- Wrist camera on the robot (planned, for M4 / AI grasping) -----------------
wrist_camera:
  source: 2                     # tbd; find indices with: python -m common.camera
  width: 1280
  height: 720
  calibration_file: null

# --- M3: inspection ----------------------------------------------------------
inspection_camera:
  source: 1
  width: 3840
  height: 2160
  calibration_file: null

inspection:
  # Part colour in HSV (OpenCV: H 0..180). Test part is purple (H ~ 125-131).
  part_hue: [115, 165]
  part_saturation_min: 50
  part_value_min: 80
  face_brightness_frac: 0.85    # darker than this fraction of the face = hole / notch
  face_saturation_delta: 40     # saturation differing more than this from the face = hole / notch
  # Feature regions relative to the part bounding box [x0, y0, x1, y1] (0..1)
  label_roi: [0.0, 0.0, 0.58, 1.0]
  hole_roi: [0.52, 0.0, 0.86, 1.0]
  notch_roi: [0.84, 0.1, 1.0, 0.9]
  # Scale: visible part height in the side view is the length reference (tbd, measure part)
  part_height_mm: 15.0
  serial_pattern: "^[0-9]{5}$"
  ocr_min_confidence: 0.4
  # Placeholder: test photos give D/H = 0.655 -> 9.8 mm for a 15 mm part (tbd, from drawing)
  hole_nominal_mm: 10.0
  hole_tolerance_mm: 0.4
