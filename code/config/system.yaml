# System configuration. All values marked "tbd" must be measured / taught on the real setup.
# Units: mm and degrees everywhere in this file (M2 converts to m / rad for the Neura API).

# Default for `python -m orchestrator` (GUI: selectable). detector: mock|replay|camera|ai, robot: mock|sim|vm|real, inspector: mock|replay|camera
implementations:
  detector: mock
  robot: mock
  inspector: mock
  grasper: robot     # PICK: robot (M2) | bc (M4 Behavior Cloning policy, settings below in m4); PLACE_INSPECT always M2

logging:
  level: INFO
  cycle_dir: logs

# --- M1: top-down camera ----------------------------------------------------
topdown_camera:
  # int = OpenCV device index, "daheng:<serial>" = Daheng camera (Galaxy SDK), other string = image file / glob
  # (replay, relative to code/). Find cameras and serials with: python -m common.camera
  # The top-down camera is a Daheng VEN-161 (1440x1080, width/height unused) - also the scene camera of M4.
  source: daheng:EBK24100634    # VEN-161-61U3C-M05 (serial required as soon as the wrist camera of M4 is plugged in too)
  # Fixed (lab 2026-11-12, exposure sweep): auto exposure overexposes on the dark board (part saturated
  # white, scratches/stains in the mask). 15000 us: board V 40, part V 190 / chroma 40, nothing saturated.
  exposure_us: 15000            # null = auto exposure (Daheng)
  gain_db: 0.0                  # null = auto gain (Daheng)
  width: 1440                   # only used for OpenCV sources, Daheng always reads the full sensor
  height: 1080
  calibration_file: null        # tbd, e.g. config/topdown_intrinsics.yaml

workspace:
  # aruco: 4 markers | white_frame: inner edge of the white frame | auto: aruco, fallback white_frame
  # (no white frame on the board any more -> aruco only)
  method: aruco
  # Extent of the workspace frame [mm]. Marker centres are 400 mm apart; the workspace is the
  # square between them, inset by 35 mm so the white marker paper (50 mm marker + quiet zone,
  # ~67 mm) stays outside and is not detected as a part.
  size_mm: [330.0, 330.0]
  px_per_mm: 2.0                # resolution of the rectified workspace image
  border_mm: 5.0                # ignored margin along the workspace edge
  aruco_dictionary: DICT_4X4_50
  # Marker centre positions in the workspace frame [mm]. Origin = bottom-left corner of the
  # workspace (35 mm inside marker 0), x to the right, y up (as seen by the camera).
  markers_mm:
    0: [-35.0, -35.0]
    1: [365.0, -35.0]
    2: [365.0, 365.0]
    3: [-35.0, 365.0]

part_topdown:
  # Part = pixels clearly brighter OR more colourful (Lab chroma) than the (dark grey) board median.
  # Photos 2026-10-05: board chroma ~2, bluish reflection ~10, purple part 40-50.
  brightness_delta: 50
  chroma_delta: 20
  min_area_mm2: 300
  max_area_mm2: 20000
  chamfer_min_frac: 0.08        # chamfer depth relative to short side to count as found
  # Empirical: the detected centre drifts outward from the image centre (parallax of the 15 mm part
  # top + uncalibrated lens). Fit from 21 pointing tests (lab 2026-11-12, logs/point_tests.csv, all
  # without correction): offset = -scale * (pos - center_mm), residual rms 0.5 mm (x) / 1.2 mm (y).
  # null = off. Replace by intrinsic calibration + height correction later.
  position_correction:
    center_mm: [227.0, 164.0]
    scale: [0.037, 0.020]

# 2D rigid transform workspace frame -> robot base frame (tbd, from teach-in of frame corners)
workspace_to_robot:
  rotation_deg: 0.35
  translation_mm: [205.1, -319.7]
  table_z_mm: 2.1

# --- M2: robot (Neura LARA, neurapy v5.0.8) ------------------------------------
robot:
  host: 192.168.2.13            # IP printed on the robot base (tbd: verify, Neura default is 192.168.2.13)
  vm_host: 192.168.2.13         # official Neura simulation (VirtualBox VM, host-only network), robot kind "vm"
  # ALL poses and limits below are TCP poses of this tool in the robot BASE frame (not the flange).
  tool_name: ZimmerLWR50            # tool as created in the Neura GUI (found in robot backup)
  # Expected TCP offset of tool_name from the flange [mm]. connect() refuses to move if the controller
  # tool differs by more than 1 mm. 197.5 = LWR50L with jaws 169.5 + LWR50F 28 (data sheets, tbd: measure
  # in the lab). The robot backup still has 210 mm -> set offsetZ of the tool on the pendant to this value.
  tool_tcp_mm: [0.0, 0.0, 197.5]
  home_point: Home              # named point stored on the robot
  override: 0.8                 # global speed override 0..1 (keep low while testing)
  joint_speed_percent: 20
  linear_speed_mps: 0.10
  approach_speed_mps: 0.03      # final linear approach / retreat
  approach_height_mm: 80
  # pick/place: down with linear_speed_mps to this height above the target, the rest with
  # approach_speed_mps (same way back up). >= approach_height_mm: whole way slow
  approach_slow_mm: 20
  grasp_height_mm: 5           # TCP height above table when grasping (depends on part / gripper)
  # TCP height above the place poses when the gripper opens: the held part hangs grasp_height_mm below
  # the TCP, plus clearance (lab 2026-11-12: 8 to be safe, check by hand, then lower to ~6)
  place_height_mm: 1             # poses taught WITH the part sitting on the surface (lab 2026-11-12)
  # rz relative to home so that the jaws close across the short side of a part with theta = 0 (long
  # axis along base x): 90 deg + 23 deg gripper mounting angle (lab 2026-10-06: home +23 deg -> jaws close
  # along base x, i.e. grip a part lying along base y / marker edge 0-3 as at the stations).
  # -67 = 113 - 180 (2026-11-12): part held the other way round -> chamfer/serial side towards the M3
  # camera at the inspection pose, without turning the place poses (joint 6 wrap, see poses).
  gripper_angle_offset_deg: -67.0
  grip_wait_s: 1.0
  gripper_enabled: true          # false = move only, skip grasp/release (first tests); always off for the Neura VM
  # Zimmer LWR50 on the control box digital outputs (wiring found by M4, lab 2026-10-23). enable must
  # stay 1 - set on connect/reset, followed by a pulse on reset (clears the gripper error state).
  # null = neurapy grasp()/release() instead.
  gripper_io: {open: DO_0, close: DO_1, enable: DO_3, reset: DO_2}
  gripper_reset_pulse_s: 1.0
  # Software workspace limits in robot base frame [mm]
  limits_mm:
    x: [100.0, 900.0]
    y: [-500.0, 500.0]
    z: [-10.0, 600.0]
  # Named poses: TCP of tool_name, [x, y, z, rx, ry, rz] in mm / deg (tbd, teach on real robot)
  # "home" = Home point: flange at z 434.5 mm (robot backup) -> TCP at 434.5 - 197.5 = 237.0 mm.
  # Home is driven as joint point; this entry gives orientation and map position.
  # Reach (Neura VM, tool pointing down): radius ~740 mm at z 130, ~700 mm at z 180 -> keep the
  # approach points (pose z + approach_height_mm) inside.
  # Stations = centre points of the zones beyond the far marker edge (camera view, workspace frame
  # approx.: bin_bad (50, 580), bin_good (50, 480), inspection (255, 455) mm). Each pose is the
  # exact place pose incl. its own z (inspection: printed fixture, surface 38 mm above the board).
  # Values below: estimate from a sketch via the placeholder workspace_to_robot -> teach with
  # 'robot_check teach' (place() opens the gripper exactly at the pose).
  poses:
    home: [420.0, 0.0, 237.0, 180.0, 0.0, 180.0]
    # Place poses = fingertips (TCP) on the surface, taught WITHOUT a part. place() opens the gripper
    # place_height_mm above them.
    # rz -157: joint 6 near 0. rz 23 put joint 6 at 178 deg (wrap) -> no IK to the bins. The part is
    # turned by 180 deg at the grasp instead (gripper_angle_offset_deg).
    inspection: [517.9, 200.5, 48.1, 180.0, -0.0, -157.0]
    bin_good: [299.7, 185.4, 9.0, -180.0, -0.0, -157.0]
    bin_bad: [297.7, 319.4, 10.0, -180.0, -0.0, -157.0]

# --- M3: inspection ----------------------------------------------------------
inspection_camera:
  # Index 0 on the lab laptop (2026-11-12; index 1 = black built-in camera). Order can change when
  # cameras are re-plugged -> check with: python -m common.camera (images in logs/cameras)
  source: 0
  width: 3840                   # lower resolutions crop the field of view on this camera
  height: 2160
  # Fixed manual focus, autofocus off (null = camera setting). The camera opened in autofocus and
  # was blurred on the part. Sweep 2026-11-12: sharpness peak at 90-95 (Logi Tune value 95).
  focus: 90                     # steps of 5 on this camera
  calibration_file: null

inspection:
  # Part colour in HSV (OpenCV: H 0..180). Test part is purple (H ~ 125-131).
  part_hue: [115, 165]
  part_saturation_min: 50
  part_value_min: 80
  face_brightness_frac: 0.85    # darker than this fraction of the face = hole / notch
  # notch only: the face gets darker towards the right end at the station (uneven light, lab
  # 2026-11-12) - with 0.85 the notch merged with that shade. Lower values shrink the hole -> separate.
  notch_brightness_frac: 0.75
  face_saturation_delta: 40     # saturation differing more than this from the face = hole / notch
  # Feature regions relative to the part bounding box [x0, y0, x1, y1] (0..1)
  label_roi: [0.0, 0.0, 0.58, 1.0]
  hole_roi: [0.52, 0.0, 0.86, 1.0]
  notch_roi: [0.84, 0.1, 1.0, 0.9]
  # Scale: visible part height in the side view is the length reference (part 60 x 40 x 15 mm)
  part_height_mm: 15.0
  serial_pattern: "^[0-9]{5}$"
  ocr_min_confidence: 0.4
  # Hole 10 mm (confirmed 2026-10-21); test photos give D/H = 0.655 -> 9.8 mm for a 15 mm part
  hole_nominal_mm: 10.0
  hole_tolerance_mm: 0.4

# --- M4: Behavior Cloning (code/m4_behavior_cloning, person 4) -----------------------
# Used when the cycle picks with M4 (implementations.grasper: bc / tab Ablauf -> Greifen "M4").
# The policy runs as a subprocess with M4's own Python (code/m4_behavior_cloning/.venv, setup_m4.bat),
# grasps the part and stops at its handover point PRE_PLACE above the inspection fixture; M2 places.
m4:
  checkpoint: null              # policy folder from training, relative to code/m4_behavior_cloning (e.g. checkpoints/<name>/policy)
  cameras: auto                 # auto | sim | real | wrist-real | wrist-uvc (apps/infer.py --cameras); scene = topdown_camera
  max_steps: null               # null = what the policy was trained with
  timeout_s: 300                # abort the run if the handover point is not reached by then
