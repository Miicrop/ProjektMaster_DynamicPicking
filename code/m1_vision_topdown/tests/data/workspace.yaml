# Workspace config matching the photos in this folder (board with printed ArUco markers glued
# on, 2026-10-05, phone camera at several heights). Overrides the `workspace` section of
# config/system.yaml in tests, so the real config can follow the current board.
method: aruco
size_mm: [330.0, 330.0]
px_per_mm: 2.0
border_mm: 5.0
aruco_dictionary: DICT_4X4_50
markers_mm:
  0: [-35.0, -35.0]
  1: [365.0, -35.0]
  2: [365.0, 365.0]
  3: [-35.0, 365.0]
